<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gafur Demo | Official Fanpage</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Montserrat', sans-serif;
            background: #09090f;
            color: #fff;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 40px 20px;
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(106, 17, 203, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(37, 117, 252, 0.15) 0%, transparent 40%);
            background-attachment: fixed;
        }
        .container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }
        .share-btn {
            position: absolute;
            top: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }
        .share-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.05);
        }
        .profile-title {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 10px;
            margin-bottom: 8px;
            background: linear-gradient(90deg, #fff, #a29bfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
        }
        .description {
            font-size: 14px;
            text-align: center;
            margin-bottom: 30px;
            font-weight: 500;
            line-height: 1.5;
            color: #b2bec3;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .links-wrapper {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .link-btn {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            position: relative;
            width: 100%;
            padding: 16px 24px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 50px;
            color: #fff;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            backdrop-filter: blur(12px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }
        .link-btn i.icon {
            font-size: 18px;
            width: 24px;
            text-align: center;
            margin-right: 15px;
            color: #dfe6e9;
        }
        .link-btn span {
            flex-grow: 1;
            text-align: center;
            margin-right: 24px;
        }
        .link-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(0,0,0,0.3);
        }
        .section-title {
            margin: 24px 0 8px;
            font-size: 11px;
            color: #636e72;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
            width: 100%;
            font-weight: 700;
        }
        .official-btn {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            border: none;
            box-shadow: 0 4px 20px rgba(37, 117, 252, 0.35);
        }
        .official-btn:hover {
            background: linear-gradient(135deg, #7a22db 0%, #3585fc 100%);
            box-shadow: 0 6px 25px rgba(37, 117, 252, 0.5);
        }
        .armon-btn {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(0, 229, 255, 0.3);
        }
        .live-badge {
            background: #00e5ff;
            color: #000;
            font-size: 10px;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 20px;
            letter-spacing: 1px;
        }
        .video-container {
            margin-top: 35px;
            width: 100%;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            background: #000;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .video-container iframe {
            width: 100%;
            aspect-ratio: 16/9;
            border: none;
            display: block;
        }
        footer {
            margin-top: 40px;
            font-size: 11px;
            color: #4b4b60;
            text-align: center;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="container">
        <button class="share-btn" onclick="sharePage()" title="Поделиться">
            <i class="fa-solid fa-share-nodes"></i>
        </button>

        <h1 class="profile-title">Gafur Demo</h1>
        <p class="description">Самый крупный и официальный фан аккаунт</p>

        <div class="links-wrapper">
            <a href="https://instagram.com/gafur.demo" target="_blank" class="link-btn">
                <i class="fa-brands fa-instagram icon" style="color: #e1306c;"></i>
                <span>Instagram</span>
            </a>
            <a href="https://youtube.com/@gafurdemo" target="_blank" class="link-btn">
                <i class="fa-brands fa-youtube icon" style="color: #ff0000;"></i>
                <span>YouTube</span>
            </a>
            <a href="https://tiktok.com/@gafur.demo" target="_blank" class="link-btn">
                <i class="fa-brands fa-tiktok icon" style="color: #00f2fe;"></i>
                <span>TikTok</span>
            </a>
            
            <div class="section-title">Официальный аккаунт</div>
            <a href="https://instagram.com/gafur.lv" target="_blank" class="link-btn official-btn">
                <i class="fa-solid fa-circle-check icon" style="color: #fff;"></i>
                <span>@gafur.lv</span>
            </a>

            <div class="section-title">Новый релиз</div>
            <a href="https://band.link/gafur_armon" target="_blank" class="link-btn armon-btn">
                <i class="fa-solid fa-compact-disc icon" style="color: #00e5ff;"></i>
                <span>ARMON</span>
                <div class="live-badge">OUT NOW</div>
            </a>
        </div>

        <div class="video-container">
            <iframe src="https://www.youtube.com/embed/c3hGzK-gwBk" title="YouTube video player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>

        <footer>
            © 2026 Gafur Demo
        </footer>
    </div>

    <script>
        function sharePage() {
            if (navigator.share) {
                navigator.share({
                    title: 'Gafur Demo',
                    text: 'Официальный фан-аккаунт Gafur Demo',
                    url: window.location.href,
                }).catch(() => {});
            } else {
                navigator.clipboard.writeText(window.location.href);
                alert('Ссылка скопирована в буфер обмена!');
            }
        }
    </script>
</body>
</html>
