'use strict';
const KEY='music_empire_save_v1', genres=['Pop','Hip-Hop','R&B','Indie','Dance','Uzbek Pop'];let S=null,tab='home',modal=null,chosen='Pop';
const $=id=>document.getElementById(id),rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),fmt=n=>Math.floor(Number(n)||0).toLocaleString('ru-RU'),usd=n=>(n<0?'−':'')+'$'+fmt(Math.abs(n)),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),compact=n=>n>=1e6?(n/1e6).toFixed(2)+'M':n>=1e3?(n/1e3).toFixed(n>=1e4?0:1)+'K':fmt(n),kindName=k=>({single:'Сингл',ep:'EP',album:'Альбом'})[k]||k;

function defaults(name,genre){return {version:2,name,genre,week:1,cash:3500,fans:120,streams:0,energy:100,skill:22,reputation:12,label:null,dealWeeks:0,distributor:'indie',distributionHistory:[],marketingLevel:0,playlistPoints:0,merchLevel:0,releases:[],events:[],history:[{week:1,cash:3500,fans:120,streams:0,earned:0}],concerts:0,concertHistory:[],totalRevenue:0,totalExpenses:0,achievements:[],lastWeekly:0}}
function normalize(o){if(!o||typeof o!=='object'||!Array.isArray(o.releases)||typeof o.name!=='string'||!Number.isFinite(o.week))throw Error('bad save');let s={...defaults(o.name,o.genre||'Pop'),...o};s.week=clamp(Math.floor(s.week),1,100000);for(const k of ['cash','fans','streams','energy','skill','reputation','totalRevenue','totalExpenses'])s[k]=Number.isFinite(Number(s[k]))?Number(s[k]):0;s.energy=clamp(s.energy,0,100);s.skill=clamp(s.skill,0,100);s.reputation=clamp(s.reputation,0,100);s.releases=s.releases.slice(0,500).filter(x=>x&&typeof x.name==='string').map((r,i)=>({...r,id:r.id||i+1,weekly:Number(r.weekly)||0,streams:Number(r.streams)||0,age:Number(r.age)||0,quality:Number(r.quality)||40,hype:Number(r.hype)||0,kind:r.kind||'single',peak:r.peak??null,cover:r.cover??i%6}));for(const k of ['events','history','concertHistory','achievements','distributionHistory'])if(!Array.isArray(s[k]))s[k]=[];return s}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Не удалось сохранить прогресс')}}function load(){try{let v=localStorage.getItem(KEY);if(v)S=normalize(JSON.parse(v))}catch(e){S=null}}
function event(t){S.events.unshift({week:S.week,text:t});S.events=S.events.slice(0,65)}function cost(n){if(S.cash<n){toast('Не хватает денег: нужно '+usd(n));return false}S.cash-=n;S.totalExpenses+=n;return true}function gain(n){S.cash+=n;S.totalRevenue+=Math.max(0,n)}function checkAchievements(){const all=[['first','Первый релиз',S.releases.length>=1],['thousand','Первая тысяча',S.fans>=1000],['tenk','10 000 фанатов',S.fans>=10000],['million','Миллион стримов',S.streams>=1000000],['stage','Первый концерт',S.concerts>=1],['album','Дебютный альбом',S.releases.some(r=>r.kind==='album')],['wealth','Звезда индустрии',S.cash>=100000],['legend','Легенда',S.fans>=100000]];all.forEach(([id,label,yes])=>{if(yes&&!S.achievements.includes(id)){S.achievements.push(id);event('🏆 Достижение: '+label)}})}
function update(){checkAchievements();save();render()}function newCareer(){let name=$('artistName')?.value.trim().slice(0,28);if(!name)return toast('Введи имя артиста');S=defaults(name,chosen);event('Начало музыкальной карьеры. Добро пожаловать!');tab='home';update()}
function doRelease(){let name=$('releaseName')?.value.trim().slice(0,42),kind=$('releaseKind')?.value||'single',promo=Number($('releasePromo')?.value||0),studio=Number($('releaseStudio')?.value||0);if(!name)return toast('Введи название релиза');if(S.releases.some(r=>r.name.toLowerCase()===name.toLowerCase()))return toast('Релиз с таким названием уже существует');let dist=distributors.find(d=>d.id===(S.distributor||'indie'))||distributors[0];if(dist.minFans>S.fans)return toast('Дистрибьютор требует '+fmt(dist.minFans)+' фанатов');let base={single:250,ep:850,album:2200}[kind],energy={single:20,ep:35,album:55}[kind],total=base+promo+studio+dist.fee;if(S.energy<energy)return toast('Нужно '+energy+' энергии');if(!cost(total))return;S.energy-=energy;let quality=clamp(Math.round(S.skill*.65+studio/100+ rnd(19,42)+(kind==='album'?3:0)),10,99),hype=Math.round(S.fans*.045+promo*.72+rnd(80,280)),r={id:Date.now()+rnd(0,999),name,kind,tracks:kind==='album'?rnd(9,13):kind==='ep'?rnd(4,6):1,quality,hype,age:0,streams:0,weekly:0,peak:null,cover:rnd(0,7),spent:total,distributor:dist.id,distributionName:dist.name,royalty:dist.royalty,platforms:dist.platforms,playlistBoost:0};S.releases.unshift(r);S.reputation=clamp(S.reputation+2,0,100);event('🎵 «'+name+'» — '+kindName(kind).toLowerCase()+' вышел!');tab='music';update();toast('Релиз опубликован! Качество '+quality+'/100')}
function advance(){S.week++;let earned=0,newFans=0,totalWeek=0;for(const r of S.releases){r.age++;let fade=Math.pow(.89,r.age-1),kind={single:1,ep:1.9,album:3.2}[r.kind]||1,base=(r.quality*r.quality*.42+S.fans*.20+r.hype*4+(r.playlistBoost||0)*120)*fade*kind*(.78+Math.random()*.47);r.weekly=Math.max(0,Math.round(base));r.streams+=r.weekly;totalWeek+=r.weekly;earned+=r.weekly*.0034*(r.royalty??1)*(S.label?(S.labelShare??.65):1);newFans+=Math.round(r.weekly*(.004+r.quality/27000));let rank=clamp(Math.round(110-Math.log10(r.weekly+1)*18+rnd(-5,5)),1,100);if(r.weekly>1000)r.peak=r.peak===null?rank:Math.min(r.peak,rank)}S.streams+=totalWeek;let income=Math.round(earned);gain(income);S.fans+=newFans;S.lastWeekly=totalWeek;S.energy=clamp(S.energy+27,0,100);if(S.merchLevel){let merch=Math.round(S.fans*.012*S.merchLevel);gain(merch);event('Мерч: +'+usd(merch)+' за неделю')}if(S.distributor==='orbit'&&S.week%4===0){S.cash-=250;S.totalExpenses+=250;event('Подписка Orbit Distribution: −$250')}S.reputation=clamp(S.reputation-1,0,100);if(S.label){S.dealWeeks--;if(S.dealWeeks<=0){event('Контракт с '+S.label+' завершён');S.label=null;S.dealWeeks=0}}if(S.week%4===0){let upkeep=150+Math.floor(S.fans/3000)*35;S.cash-=upkeep;S.totalExpenses+=upkeep;event('Расходы на команду: '+usd(upkeep))}industryTick();S.history.push({week:S.week,cash:Math.round(S.cash),fans:S.fans,streams:S.streams,earned:income});S.history=S.history.slice(-60);event('Новая неделя: '+compact(totalWeek)+' стримов · +'+fmt(newFans)+' фанатов · '+usd(income));update();toast('Неделя '+S.week+' · '+usd(income)+' дохода')}
function train(){if(S.energy<20)return toast('Нужно 20 энергии');if(!cost(300))return;S.energy-=20;let n=rnd(3,6);S.skill=clamp(S.skill+n,0,100);event('Тренировка вокала и записи: +'+n+' к мастерству');update();toast('Мастерство +'+n)}function promo(){if(!cost(500))return;let f=rnd(95,240)+Math.floor(S.reputation*2);S.fans+=f;S.reputation=clamp(S.reputation+1,0,100);event('Рекламная кампания: +'+f+' фанатов');update();toast('+'+f+' фанатов')}function rest(){if(S.energy>=100)return toast('Энергия уже полная');S.energy=clamp(S.energy+45,0,100);event('Время на отдых и восстановление');update();toast('+45 энергии')}
function concert(){let v=$('venue')?.value||'club',data={club:{cost:400,min:400,capacity:250,ticket:18,name:'Клуб'},hall:{cost:2200,min:2500,capacity:1200,ticket:25,name:'Концертный зал'},arena:{cost:12000,min:18000,capacity:8500,ticket:38,name:'Арена'},stadium:{cost:48000,min:85000,capacity:40000,ticket:52,name:'Стадион'}}[v];if(S.fans<data.min)return toast('Нужно минимум '+fmt(data.min)+' фанатов');if(S.energy<35)return toast('Нужно 35 энергии');if(!cost(data.cost))return;S.energy-=35;let attendance=clamp(Math.round(S.fans*(.14+Math.random()*.20)),0,data.capacity),revenue=attendance*data.ticket,profit=revenue-data.cost;gain(revenue);S.fans+=Math.floor(attendance*.09);S.reputation=clamp(S.reputation+3,0,100);S.concerts++;S.concertHistory.unshift({week:S.week,venue:data.name,attendance,revenue,profit});event('🎤 '+data.name+': '+fmt(attendance)+' зрителей, прибыль '+usd(profit));update();toast('Концерт! Прибыль '+usd(profit))}

function pitchPlaylist(id){let r=S.releases.find(x=>x.id===id);if(!r)return;if(r.age>12)return toast('Питчинг доступен первые 12 недель');if(!cost(350))return;let chance=clamp(15+r.quality*.48+S.reputation*.18,10,85),success=Math.random()*100<chance;if(success){r.playlistBoost=(r.playlistBoost||0)+rnd(60,160);S.fans+=rnd(70,220);event('♫ «'+r.name+'» попал в игровой плейлист!')}else event('♫ Питчинг «'+r.name+'» не прошёл отбор');update();toast(success?'Трек добавлен в плейлист!':'Не приняли. Попробуй снова')}
function upgradeMerch(){let level=S.merchLevel||0;if(level>=3)return toast('Максимальный уровень');if(S.fans<500)return toast('Для магазина нужно 500 фанатов');if(!cost(1200+level*2800))return;S.merchLevel=level+1;event('Магазин мерча улучшен до уровня '+S.merchLevel);update();toast('Магазин улучшен!')}
function distribution(){let d=currentDistributor();return `<div class="eyebrow" style="margin:8px 3px">ТВОЯ МУЗЫКА — ВЕСЬ МИР</div><h1 class="pageTitle">Дистрибуция</h1><p class="lead">Выбирай партнёра для будущих релизов. Комиссии и роялти влияют на реальный доход внутри игры.</p><div class="card hero"><span class="tag">● ТВОЙ ПАРТНЁР</span><h2>${esc(d.name)}</h2><p>${esc(d.desc)}</p><div class="two"><div class="stat"><div class="muted small">Твоя доля</div><div class="num">${Math.round(d.royalty*100)}%</div></div><div class="stat"><div class="muted small">Площадки</div><div class="num">${d.platforms}</div></div></div></div><div class="section">Каталог дистрибьюторов</div>${distributors.map(x=>`<div class="card distCard ${x.id===d.id?'distSelected':''}"><div class="row"><div><span class="tag ${x.id===d.id?'':'purple'}">${esc(x.tag)}</span><h2 style="margin:12px 0 4px;font-size:22px">${esc(x.name)}</h2></div><div class="distPercent">${Math.round(x.royalty*100)}<span>%</span></div></div><p class="muted small" style="line-height:1.6">${esc(x.desc)}</p><div class="distMetrics"><span>↗ ${x.platforms} площадок</span><span>◈ ${usd(x.fee)} / релиз</span><span>♙ ${fmt(x.minFans)} фанатов</span></div><button class="btn ${x.id===d.id?'dark':'wide'}" ${x.id===d.id||S.fans<x.minFans?'disabled':''} onclick="selectDistributor('${x.id}')">${x.id===d.id?'✓ Выбран':S.fans<x.minFans?'🔒 Требуется '+fmt(x.minFans)+' фанатов':'Выбрать дистрибьютора →'}</button></div>`).join('')}<div class="card"><div class="cardTitle">Как работает дистрибуция?</div><p class="muted small" style="line-height:1.8">При выпуске релиза сохраняются условия выбранного партнёра. Будущие стримы начисляют роялти по этим условиям. Смена дистрибьютора влияет на новые релизы, но не меняет старые. Лейбл может дополнительно удерживать свою долю.</p><p class="muted tiny">Все названия дистрибьюторов и музыкальные площадки в этой игре вымышлены.</p></div>`}


// INDUSTRY EXPANSION 4.0: deterministic saved career state, interactive competitors, collaborations and businesses.
const producers=[{name:'Home Studio',fee:0,bonus:0},{name:'Mira Beats',fee:750,bonus:7},{name:'Atlas Audio',fee:2800,bonus:15},{name:'Gold Room',fee:9500,bonus:25}];
const rivals=[{name:'NOVA',base:1800,growth:1.055},{name:'RAYN',base:7200,growth:1.042},{name:'KAIRO',base:25000,growth:1.035},{name:'LUNA V',base:100000,growth:1.026}];
const collabs=[{name:'NOVA',fee:950,fans:400,boost:450},{name:'RAYN',fee:3600,fans:2500,boost:1700},{name:'KAIRO',fee:14000,fans:15000,boost:6500},{name:'LUNA V',fee:48000,fans:60000,boost:25000}];
const sponsors=[{name:'Streetwear Co.',fans:1500,pay:1200},{name:'Wave Headphones',fans:10000,pay:8500},{name:'Vortex Mobile',fans:50000,pay:38000},{name:'Astra Motors',fans:180000,pay:145000}];
function initIndustry(){if(!S)return;S.industry??={producer:0,social:0,socialCooldown:0,collabs:[],sponsors:[],awards:[],labelOwned:false,labelArtists:[],viralWeeks:0,press:50,rivalWins:0};let i=S.industry;i.collabs??=[];i.sponsors??=[];i.awards??=[];i.labelArtists??=[];i.press=Number.isFinite(i.press)?i.press:50;i.social??=0;i.socialCooldown??=0;i.producer??=0;i.viralWeeks??=0;i.rivalWins??=0}
function industryTick(){initIndustry();let i=S.industry;i.socialCooldown=Math.max(0,i.socialCooldown-1);let followers=Math.round(S.fans*(.5+i.social*.1));let passive=Math.round(followers*(.002+i.social*.001));if(passive>0&&i.social>0){gain(passive);event('Соцсети: рекламный доход '+usd(passive))}if(i.labelOwned){let income=0;for(let a of i.labelArtists){let rev=Math.round((a.popularity*3.2)*(0.75+Math.random()*.6));income+=rev;a.popularity=Math.round(a.popularity*(.98+Math.random()*.055));}if(income){gain(income);event('Собственный лейбл: +'+usd(income))}}if(i.viralWeeks>0){i.viralWeeks--;let bonus=rnd(120,550);S.fans+=bonus;event('Вирусный ролик: +'+bonus+' фанатов')}if(S.week%8===0){let chance=clamp(S.reputation*.35+S.fans/6000,5,85);if(Math.random()*100<chance){let title=S.streams>300000?'Хит сезона':S.fans>10000?'Открытие года':'Восходящая звезда';if(!i.awards.some(a=>a.week===S.week)){i.awards.unshift({week:S.week,title});S.reputation=clamp(S.reputation+8,0,100);event('🏆 Музыкальная премия: '+title)}}}i.press=clamp(i.press+rnd(-3,3),0,100)}
function chooseProducer(n){initIndustry();let p=producers[n];if(!p)return;if(!cost(p.fee))return;S.industry.producer=n;S.skill=clamp(S.skill+Math.max(1,Math.round(p.bonus/3)),0,100);event('Сессия с продюсером '+p.name);update();toast('Студийная сессия завершена')}
function socialCampaign(type){initIndustry();let i=S.industry;if(i.socialCooldown)return toast('Новая публикация доступна через '+i.socialCooldown+' нед.');let cfg={post:{fee:0,energy:12,reach:90},clip:{fee:450,energy:22,reach:320},viral:{fee:2100,energy:35,reach:1100}}[type];if(!cfg)return;if(S.energy<cfg.energy)return toast('Не хватает энергии');if(!cost(cfg.fee))return;S.energy-=cfg.energy;i.socialCooldown=1;i.social++;let fans=rnd(Math.round(cfg.reach*.45),Math.round(cfg.reach*1.5))*(1+Math.floor(S.reputation/40));S.fans+=fans;let viral=type==='viral'&&Math.random()<clamp(.14+S.skill/300,.14,.48);if(viral){i.viralWeeks=3;event('Видео стало вирусным! Три недели роста аудитории')}event('Публикация в соцсетях: +'+fmt(fans)+' фанатов');update();toast('+'+fmt(fans)+' фанатов'+(viral?' · ВИРУСНЫЙ ХИТ!':''))}
function collaboration(n){initIndustry();let c=collabs[n];if(!c||S.fans<c.fans)return toast('Недостаточно фанатов для фита');if(S.energy<30)return toast('Нужно 30 энергии');if(!cost(c.fee))return;S.energy-=30;let gained=rnd(Math.round(c.boost*.5),Math.round(c.boost*1.2));S.fans+=gained;S.reputation=clamp(S.reputation+4,0,100);S.industry.collabs.unshift({week:S.week,name:c.name,gained});event('Совместная работа с '+c.name+': +'+fmt(gained)+' фанатов');update();toast('Фит с '+c.name+' состоялся!')}
function sponsor(n){initIndustry();let x=sponsors[n];if(!x||S.fans<x.fans)return toast('Бренд пока не заинтересован');if(S.industry.sponsors.includes(x.name))return toast('Контракт уже заключён');S.industry.sponsors.push(x.name);gain(x.pay);S.reputation=clamp(S.reputation+3,0,100);event('Рекламный контракт '+x.name+': +'+usd(x.pay));update();toast('Бренд-контракт подписан!')}
function openOwnLabel(){initIndustry();if(S.industry.labelOwned)return;if(S.fans<10000)return toast('Нужно 10 000 фанатов');if(S.label)return toast('Сначала заверши контракт с лейблом');if(!cost(18000))return;S.industry.labelOwned=true;event('Основан собственный лейбл!');update();toast('Твой лейбл открыт!')}
function signArtist(n){initIndustry();if(!S.industry.labelOwned)return;let artists=[{name:'ECHO',fee:3500,popularity:200},{name:'SORA',fee:12000,popularity:950},{name:'VEX',fee:40000,popularity:3600}];let a=artists[n];if(!a||S.industry.labelArtists.some(x=>x.name===a.name))return;if(!cost(a.fee))return;S.industry.labelArtists.push({...a});event('На твой лейбл подписан '+a.name);update();toast('Артист подписан!')}
function industry(){initIndustry();let i=S.industry;let rivalRows=rivals.map(r=>({...r,score:Math.round(r.base*Math.pow(r.growth,Math.min(S.week-1,220)))})).sort((a,b)=>b.score-a.score);let own=Math.round(S.lastWeekly||0);let rank=1+rivalRows.filter(r=>r.score>own).length;return `<div class="eyebrow" style="margin:8px 3px">MUSIC BUSINESS · EXPANSION 4.0</div><h1 class="pageTitle">Индустрия</h1><p class="lead">Сотрудничай, развивай медиа, соревнуйся с артистами и создай собственный лейбл.</p>
<div class="card hero"><span class="tag">КАРЬЕРА В ТВОИХ РУКАХ</span><h2>За сценой начинается бизнес.</h2><p>Каждое решение влияет на фанатов, репутацию и доход.</p><div class="two"><div class="stat"><div class="muted small">Твой рейтинг</div><div class="num">#${rank}</div></div><div class="stat"><div class="muted small">Репутация</div><div class="num">${S.reputation}/100</div></div></div></div>
<div class="section">Конкуренты · стримы за неделю</div><div class="card">${[...rivalRows.map(x=>({name:x.name,score:x.score,own:false})),{name:S.name,score:own,own:true}].sort((a,b)=>b.score-a.score).map((x,n)=>`<div class="listItem row"><div class="stack"><span class="rank" style="color:${x.own?'var(--lime)':'var(--muted)'}">${n+1}</span><div><div class="itemName">${esc(x.name)} ${x.own?'<span class="tag">ТЫ</span>':''}</div><div class="itemSub">${x.own?'Твои релизы':'Виртуальный конкурент'}</div></div></div><b>${compact(x.score)}</b></div>`).join('')}</div>
<div class="section">Социальные сети</div><div class="card"><div class="row"><div><div class="cardTitle">Медиа и вирусные видео</div><div class="muted small" style="margin-top:5px">${fmt(Math.round(S.fans*(.5+i.social*.1)))} подписчиков · ${i.social} публикаций</div></div><span class="tag purple">SOCIAL</span></div><p class="muted small">Публикации расходуют энергию. Видео иногда становятся вирусными и продолжают привлекать фанатов.</p><div class="actionGrid"><button class="btn dark" onclick="socialCampaign('post')">Пост<br><small>Бесплатно · 12 ⚡</small></button><button class="btn dark" onclick="socialCampaign('clip')">Клип<br><small>$450 · 22 ⚡</small></button><button class="btn" onclick="socialCampaign('viral')">Промо-видео<br><small>$2 100 · 35 ⚡</small></button></div>${i.socialCooldown?'<div class="help">Следующая публикация — на новой неделе.</div>':''}</div>
<div class="section">Продюсеры</div><div class="card"><p class="muted small">Записывайся с профессионалами, чтобы повышать мастерство и качество будущих релизов.</p>${producers.slice(1).map((p,n)=>`<div class="listItem row"><div><div class="itemName">${p.name}</div><div class="itemSub">Бонус к мастерству · ${p.bonus} баллов потенциала</div></div><button class="btn smallbtn dark" onclick="chooseProducer(${n+1})">${usd(p.fee)}</button></div>`).join('')}</div>
<div class="section">Совместные треки</div><div class="card">${collabs.map((c,n)=>`<div class="listItem"><div class="row"><div><div class="itemName">${c.name}</div><div class="itemSub">Нужно ${fmt(c.fans)} фанатов · гонорар ${usd(c.fee)}</div></div><button class="btn smallbtn" ${S.fans<c.fans?'disabled':''} onclick="collaboration(${n})">Записать фит</button></div></div>`).join('')}<div class="help">Фиты увеличивают аудиторию и репутацию. Требуется 30 энергии.</div></div>
<div class="section">Рекламные контракты</div><div class="card">${sponsors.map((x,n)=>`<div class="listItem row"><div><div class="itemName">${x.name}</div><div class="itemSub">От ${fmt(x.fans)} фанатов · выплата ${usd(x.pay)}</div></div><button class="btn smallbtn dark" ${S.fans<x.fans||i.sponsors.includes(x.name)?'disabled':''} onclick="sponsor(${n})">${i.sponsors.includes(x.name)?'✓ Подписан':'Контракт'}</button></div>`).join('')}</div>
<div class="section">Собственный лейбл</div><div class="card"><div class="row"><div class="cardTitle">EMPIRE RECORDS</div><span class="tag ${i.labelOwned?'':'purple'}">${i.labelOwned?'ОТКРЫТ':'ЗАКРЫТ'}</span></div><p class="muted small">Открой собственную компанию, подписывай артистов и получай доход с их каталога каждую неделю.</p>${!i.labelOwned?`<button class="btn wide" ${S.fans<10000?'disabled':''} onclick="openOwnLabel()">Основать лейбл · $18 000</button><div class="help">Требуется 10 000 фанатов и отсутствие действующего контракта.</div>`:[{name:'ECHO',fee:3500},{name:'SORA',fee:12000},{name:'VEX',fee:40000}].map((a,n)=>`<div class="listItem row"><div><div class="itemName">${a.name}</div><div class="itemSub">${i.labelArtists.some(x=>x.name===a.name)?'Артист твоего лейбла':'Подписать за '+usd(a.fee)}</div></div><button class="btn smallbtn dark" ${i.labelArtists.some(x=>x.name===a.name)?'disabled':''} onclick="signArtist(${n})">${i.labelArtists.some(x=>x.name===a.name)?'✓ В команде':'Подписать'}</button></div>`).join('')}</div>
<div class="section">Музыкальные награды</div><div class="card">${i.awards.length?i.awards.map(a=>`<div class="listItem row"><span>🏆 ${esc(a.title)}</span><span class="muted small">Неделя ${a.week}</span></div>`).join(''):'<div class="empty">Награды вручаются каждые 8 недель. Развивай популярность и репутацию.</div>'}</div><div class="card"><div class="cardTitle">Последние коллаборации</div>${i.collabs.length?i.collabs.slice(0,5).map(c=>`<div class="listItem row"><span>${esc(c.name)} · неделя ${c.week}</span><b class="positive">+${fmt(c.gained)}</b></div>`).join(''):'<div class="empty">Пока нет совместных проектов.</div>'}</div>`}

load();if(S?.label&&!S.labelShare)S.labelShare=.65;render();if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
