<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>АЗС Радар УЗ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://api-maps.yandex.ru/2.1/?apikey=21142e8f-7848-4389-bedc-994119d67566&lang=ru_RU"></script>
    <style>
        body { 
            margin: 0; padding: 0; font-family: sans-serif; 
            background: var(--tg-theme-bg-color, #1c1c1d); 
            color: var(--tg-theme-text-color, #ffffff);
        }
        #map { width: 100vw; height: 50vh; }
        .panel { padding: 15px; }
        select, input {
            width: 100%; padding: 10px; margin-bottom: 10px;
            border-radius: 8px; border: 1px solid #333;
            background: var(--tg-theme-secondary-bg-color, #2c2c2e);
            color: var(--tg-theme-text-color, #ffffff);
            box-sizing: border-box; font-size: 16px;
        }
        .btn { 
            display: block; width: 100%; padding: 14px; margin-top: 10px;
            background: var(--tg-theme-button-color, #007aff); 
            color: var(--tg-theme-button-text-color, #fff);
            border: none; border-radius: 8px; font-weight: bold; font-size: 16px;
        }
        .history { margin-top: 20px; font-size: 14px; }
        .history-item { 
            padding: 10px; border-bottom: 1px solid #333; 
            display: flex; justify-content: space-between;
        }
    </style>
</head>
<body>

    <div id="map"></div>
    
    <div class="panel">
        <h3>Мое авто</h3>
        <select id="carSelect" onchange="saveSettings()">
            <option value="Chevrolet Onix Premier">Chevrolet Onix Premier</option>
            <option value="Chevrolet Cobalt">Chevrolet Cobalt</option>
            <option value="Chevrolet Malibu 2 Premier">Chevrolet Malibu 2 Premier</option>
            <option value="Daewoo Matiz (белый)">Daewoo Matiz</option>
        </select>

        <h3>Добавить заправку</h3>
        <input type="number" id="expenseAmount" placeholder="Сумма в сумах (например, 150000)">
        <button class="btn" onclick="addExpense()">Записать расход</button>

        <div class="history">
            <h3>История заправок</h3>
            <div id="historyList">Пока пусто</div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Инициализация карты
        ymaps.ready(init);
        function init(){
            var myMap = new ymaps.Map("map", {
                center: [41.311081, 69.240562], // Ташкент
                zoom: 12
            });

            // Две тестовые заправки
            var placemark1 = new ymaps.Placemark([41.311081, 69.240562], { balloonContent: '<b>UzGazOil</b><br>АИ-92: 10500 сум' });
            var placemark2 = new ymaps.Placemark([41.315000, 69.250000], { balloonContent: '<b>Mustang</b><br>АИ-92: 10700 сум' });
            myMap.geoObjects.add(placemark1).add(placemark2);
        }

        // Загрузка сохраненных данных
        window.onload = function() {
            let savedCar = localStorage.getItem('myCar');
            if(savedCar) document.getElementById('carSelect').value = savedCar;
            renderHistory();
        }

        // Сохранение выбранного авто
        function saveSettings() {
            localStorage.setItem('myCar', document.getElementById('carSelect').value);
        }

        // Добавление расхода
        function addExpense() {
            let amount = document.getElementById('expenseAmount').value;
            if(!amount) return tg.showAlert('Введите сумму!');

            let history = JSON.parse(localStorage.getItem('fuelHistory') || '[]');
            let date = new Date().toLocaleDateString('ru-RU');
            
            history.unshift({ date: date, amount: amount + ' UZS' });
            localStorage.setItem('fuelHistory', JSON.stringify(history));
            
            document.getElementById('expenseAmount').value = '';
            tg.HapticFeedback.notificationOccurred('success'); // Вибрация
            renderHistory();
        }

        // Отрисовка истории
        function renderHistory() {
            let history = JSON.parse(localStorage.getItem('fuelHistory') || '[]');
            let listHTML = '';
            history.forEach(item => {
                listHTML += `<div class="history-item"><span>${item.date}</span><b>${item.amount}</b></div>`;
            });
            document.getElementById('historyList').innerHTML = listHTML || 'Пока пусто';
        }
    </script>
</body>
</html>
