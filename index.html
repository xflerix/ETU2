<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#10121b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.png"><title>MUSIC EMPIRE</title><style>
:root{color-scheme:dark;--bg:#0d1018;--panel:#191e2b;--panel2:#222a3a;--text:#f4f6fb;--muted:#9ba6bc;--accent:#b0ff73;--line:#30394c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}button,input,select{font:inherit}button{cursor:pointer}header{padding:calc(env(safe-area-inset-top) + 17px) 18px 13px;background:#111622;position:sticky;top:0;z-index:3;border-bottom:1px solid var(--line)}.brand{font-weight:950;letter-spacing:2px;font-size:21px}.brand b{color:var(--accent)}.subtitle{color:var(--muted);font-size:12px;margin-top:3px}.wrap{padding:18px 15px calc(105px + env(safe-area-inset-bottom));max-width:640px;margin:auto}.card{background:var(--panel);border:1px solid var(--line);border-radius:19px;padding:17px;margin-bottom:13px}.card h3{margin:0 0 12px;font-size:16px}.muted{color:var(--muted);font-size:13px}.hero{background:linear-gradient(135deg,#2c4033,#171f30 65%);border-color:#4b6b4c}.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{background:var(--panel2);padding:13px;border-radius:13px}.stat strong{display:block;font-size:20px;margin-top:5px}.stat small{color:var(--muted)}.btn{border:0;border-radius:12px;background:var(--accent);color:#15200d;font-weight:800;padding:12px 15px}.btn.secondary{background:#303a4d;color:white}.btn:disabled{opacity:.35}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.field{width:100%;background:#111622;color:white;border:1px solid #3c475c;border-radius:12px;padding:13px;margin:7px 0 11px;outline:none}.label{font-size:12px;color:var(--muted);font-weight:700}.item{padding:12px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.item strong{display:block;margin-bottom:4px}.pill{display:inline-block;background:#314233;color:#c5ffa2;border-radius:9px;padding:4px 8px;font-size:11px;font-weight:700}.nav{position:fixed;bottom:0;left:0;right:0;z-index:5;background:#171c29;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:9px 2px calc(8px + env(safe-area-inset-bottom))}.nav button{border:0;background:none;color:#a8b3c5;font-size:10px;min-width:16%;padding:4px 0}.nav button span{display:block;font-size:22px;margin-bottom:3px}.nav button.active{color:var(--accent)}.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#d7ffa7;color:#14200d;border-radius:12px;padding:12px 16px;font-weight:700;z-index:10;max-width:90%;width:max-content;box-shadow:0 12px 40px #0009}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.progress{height:7px;background:#3b4655;border-radius:6px;overflow:hidden;margin:9px 0}.progress>div{height:100%;background:var(--accent)}.cover{width:56px;height:56px;border-radius:11px;background:linear-gradient(145deg,#a0fa76,#3158a1);display:grid;place-items:center;color:#0a1b19;font-size:24px;flex-shrink:0}.empty{padding:24px;text-align:center;color:var(--muted)}.title{font-size:25px;font-weight:900;margin:0 0 15px}.mini{font-size:11px;color:var(--muted)}.rank{font-weight:900;color:var(--accent);font-size:20px;min-width:37px}#setup{min-height:100vh;display:grid;place-items:center;padding:24px}#setup .card{width:100%;max-width:430px}</style></head><body><div id="app"></div><script>
const KEY='music_empire_save_v1';let state;let tab='home';const genres=['Pop','Hip-Hop','R&B','Indie','Dance','Uzbek Pop'];const fmt=n=>Math.floor(n).toLocaleString('ru-RU');const money=n=>'$'+fmt(n);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;function save(){localStorage.setItem(KEY,JSON.stringify(state))}function load(){try{state=JSON.parse(localStorage.getItem(KEY));if(!state||!Array.isArray(state.releases))state=null}catch(e){state=null}}function notify(t){let x=document.createElement('div');x.className='toast';x.textContent=t;document.body.append(x);setTimeout(()=>x.remove(),2400)}function start(){let name=document.getElementById('artist').value.trim().slice(0,24);let genre=document.getElementById('genre').value;if(!name)return notify('Введи имя артиста');state={name,genre,week:1,cash:2500,fans:100,reputation:10,energy:100,skill:15,label:null,dealWeeks:0,streams:0,releases:[],events:[],concerts:0,albums:0,marketing:0,history:[],lastChart:0};save();render()}function addEvent(t){state.events.unshift('Неделя '+state.week+': '+t);state.events=state.events.slice(0,25)}function spend(n){if(state.cash<n){notify('Недостаточно денег');return false}state.cash-=n;return true}function release(){let name=document.getElementById('songname').value.trim().slice(0,40);let kind=document.getElementById('kind').value;let budget=Number(document.getElementById('budget').value);let cost=(kind==='album'?1500:kind==='ep'?650:200)+budget;if(!name)return notify('Введи название релиза');if(state.energy<(kind==='album'?45:kind==='ep'?30:18))return notify('Не хватает энергии — отдохни');if(!spend(cost))return;state.energy-=kind==='album'?45:kind==='ep'?30:18;let quality=Math.min(100,Math.round(state.skill*.7+rand(20,60)+(kind==='album'?5:0)));let hype=Math.round(state.fans*.08+budget*.4+rand(30,170));let tracks=kind==='album'?rand(9,13):kind==='ep'?rand(4,6):1;let r={id:Date.now(),name,kind,tracks,quality,hype,age:0,streams:0,peak:null,weekly:0};state.releases.unshift(r);if(kind==='album')state.albums++;state.reputation=Math.min(100,state.reputation+2);addEvent('Релиз «'+name+'» вышел!');save();tab='releases';render();notify('Релиз опубликован!')}function nextWeek(){state.week++;let earned=0;let fansGained=0;state.releases.forEach(r=>{r.age++;let decay=Math.pow(.88,r.age-1);let base=(r.quality*25+state.fans*.14+r.hype*4)*decay*(.7+Math.random()*.6);let weekly=Math.max(10,Math.floor(base*(r.kind==='album'?2.6:r.kind==='ep'?1.7:1)));r.weekly=weekly;r.streams+=weekly;state.streams+=weekly;earned+=weekly*.0035*(state.label?.65:1);fansGained+=Math.floor(weekly*(.007+r.quality/20000));let rank=Math.max(1,Math.min(100,Math.floor(100-weekly/500+rand(-7,7))));r.peak=r.peak===null?rank:Math.min(r.peak,rank)});state.cash+=Math.round(earned);state.fans+=fansGained;state.energy=Math.min(100,state.energy+22);state.reputation=Math.max(0,state.reputation-1);if(state.label){state.dealWeeks--;if(state.dealWeeks<=0){addEvent('Контракт с лейблом завершён');state.label=null}}if(state.week%4===0){let expense=250+Math.floor(state.fans/2500)*30;state.cash-=expense;addEvent('Расходы на команду: '+money(expense))}state.history.push({week:state.week,earned:Math.round(earned),fans:fansGained});addEvent('Доход от стриминга: '+money(earned)+', новых фанатов: '+fmt(fansGained));save();render();notify('Прошла неделя +'+money(earned))}function train(){if(!spend(250))return;if(state.energy<20){state.cash+=250;return notify('Нужно восстановить энергию')}state.energy-=20;state.skill=Math.min(100,state.skill+rand(3,7));addEvent('Прокачан навык записи');save();render();notify('Навык улучшен')}function promo(){if(!spend(450))return;let f=rand(90,220)+Math.floor(state.reputation*2);state.fans+=f;state.reputation=Math.min(100,state.reputation+1);addEvent('Рекламная кампания: +'+f+' фанатов');save();render();notify('+'+f+' фанатов')}function rest(){state.energy=Math.min(100,state.energy+40);addEvent('День отдыха и восстановления');save();render();notify('Энергия восстановлена')}function concert(){let size=document.getElementById('venue').value;let data={club:[300,120,500],hall:[1300,600,2500],arena:[5000,2500,12000]}[size];if(state.fans<data[2])return notify('Нужно минимум '+fmt(data[2])+' фанатов');if(state.energy<35)return notify('Не хватает энергии');if(!spend(data[0]))return;state.energy-=35;let sold=Math.min(data[2],Math.round(state.fans*(.15+Math.random()*.22)));let income=Math.round(sold*(size==='arena'?12:size==='hall'?8:5));state.cash+=income;state.fans+=Math.floor(sold*.12);state.concerts++;state.reputation=Math.min(100,state.reputation+4);addEvent('Концерт: '+sold+' зрителей, выручка '+money(income));save();render();notify('Концерт принёс '+money(income))}function contract(){if(state.label)return notify('У тебя уже есть контракт');if(state.fans<3000)return notify('Для контракта нужно 3 000 фанатов');state.label='Empire Records';state.dealWeeks=12;state.cash+=4000;state.reputation=Math.min(100,state.reputation+5);addEvent('Подписан контракт с Empire Records на 12 недель');save();render();notify('Аванс $4 000!')}function leaveLabel(){if(!state.label)return;if(!spend(2500))return;state.label=null;state.dealWeeks=0;addEvent('Контракт расторгнут');save();render()}function reset(){if(confirm('Удалить карьеру и начать заново?')){localStorage.removeItem(KEY);state=null;render()}}function header(){return `<header><div class="brand">MUSIC <b>EMPIRE</b></div><div class="subtitle">${esc(state.name)} · ${esc(state.genre)} · Неделя ${state.week}</div></header>`}function stats(){return `<div class="statgrid"><div class="stat"><small>Баланс</small><strong>${money(state.cash)}</strong></div><div class="stat"><small>Фанаты</small><strong>${fmt(state.fans)}</strong></div><div class="stat"><small>Прослушивания</small><strong>${fmt(state.streams)}</strong></div><div class="stat"><small>Репутация</small><strong>${state.reputation}/100</strong></div></div>`}function home(){return `<h1 class="title">Карьера артиста</h1><div class="card hero"><span class="pill">ТВОЯ ИСТОРИЯ</span><h2>${esc(state.name)}</h2><p class="muted">Начни с маленькой студии и построй музыкальную империю. Каждая неделя приносит новые результаты.</p>${stats()}<div class="actions"><button class="btn" onclick="nextWeek()">⏩ Следующая неделя</button></div></div><div class="card"><h3>Развитие</h3><div class="row"><span>Энергия</span><b>${state.energy}/100</b></div><div class="progress"><div style="width:${state.energy}%"></div></div><div class="row"><span>Мастерство</span><b>${state.skill}/100</b></div><div class="progress"><div style="width:${state.skill}%"></div></div><div class="actions"><button class="btn secondary" onclick="train()">🎙️ Студия · $250</button><button class="btn secondary" onclick="promo()">📢 Реклама · $450</button><button class="btn secondary" onclick="rest()">🛌 Отдых</button></div></div><div class="card"><h3>Новости карьеры</h3>${state.events.length?state.events.slice(0,6).map(e=>`<div class="item muted">${esc(e)}</div>`).join(''):'<div class="empty">История только начинается</div>'}</div>`}function releases(){return `<h1 class="title">Музыка</h1><div class="card"><h3>Новый релиз</h3><label class="label">НАЗВАНИЕ</label><input id="songname" class="field" maxlength="40" placeholder="Название трека или альбома"><label class="label">ФОРМАТ</label><select id="kind" class="field"><option value="single">Сингл · $200</option><option value="ep">EP · $650</option><option value="album">Альбом · $1 500</option></select><label class="label">ПРОДВИЖЕНИЕ</label><select id="budget" class="field"><option value="0">Без рекламы · $0</option><option value="250">Базовое · $250</option><option value="1000">Большая кампания · $1 000</option><option value="3000">Максимальное · $3 000</option></select><button class="btn" onclick="release()">Выпустить релиз</button><p class="muted">Качество зависит от мастерства. Прослушивания и доходы начисляются каждую игровую неделю.</p></div><div class="card"><h3>Дискография · ${state.releases.length}</h3>${state.releases.length?state.releases.map(r=>`<div class="item row"><div class="cover">♫</div><div style="flex:1"><strong>${esc(r.name)}</strong><div class="mini">${r.kind.toUpperCase()} · ${r.tracks} трек(ов) · качество ${r.quality}/100</div><div class="muted">▶ ${fmt(r.streams)} · за неделю ${fmt(r.weekly)}</div></div></div>`).join(''):'<div class="empty">Пока нет релизов</div>'}</div>`}function charts(){let list=[...state.releases].sort((a,b)=>b.weekly-a.weekly);return `<h1 class="title">Чарты</h1><div class="card"><h3>Empire Top 100</h3><p class="muted">Виртуальный чарт твоих релизов. Рейтинг обновляется каждую неделю.</p>${list.length?list.map((r,i)=>`<div class="item row"><div class="rank">#${r.peak??'—'}</div><div style="flex:1"><strong>${esc(r.name)}</strong><div class="muted">${fmt(r.weekly)} стримов/нед. · лучший результат #${r.peak??'—'}</div></div><span class="pill">${r.quality}/100</span></div>`).join(''):'<div class="empty">Выпусти первый трек, чтобы попасть в чарт</div>'}</div><div class="card"><h3>Карьера в цифрах</h3>${stats()}</div>`}function shows(){return `<h1 class="title">Концерты</h1><div class="card"><h3>Организовать выступление</h3><p class="muted">Выбирай площадку по популярности. Билеты приносят доход, а концерты — новых фанатов.</p><label class="label">ПЛОЩАДКА</label><select id="venue" class="field"><option value="club">Клуб · $300 · от 500 фанатов</option><option value="hall">Концертный зал · $1 300 · от 2 500</option><option value="arena">Арена · $5 000 · от 12 000</option></select><button class="btn" onclick="concert()">Провести концерт</button></div><div class="card"><h3>Статистика выступлений</h3><div class="statgrid"><div class="stat"><small>Концерты</small><strong>${state.concerts}</strong></div><div class="stat"><small>Фанаты</small><strong>${fmt(state.fans)}</strong></div></div></div>`}function business(){return `<h1 class="title">Бизнес</h1><div class="card"><h3>Лейбл</h3><p>${state.label?'<span class="pill">КОНТРАКТ АКТИВЕН</span> '+esc(state.label):'Независимый артист'}</p><p class="muted">Empire Records предлагает аванс $4 000 на 12 недель, но забирает 35% стриминговых доходов. Требуется 3 000 фанатов.</p>${state.label?`<p>Осталось недель: <b>${state.dealWeeks}</b></p><button class="btn secondary" onclick="leaveLabel()">Расторгнуть · $2 500</button>`:'<button class="btn" onclick="contract()">Подписать контракт</button>'}</div><div class="card"><h3>Финансы</h3>${stats()}<p class="muted">Выплаты за стримы — $3,50 за 1 000 прослушиваний до доли лейбла. Каждые 4 недели оплачиваются расходы команды.</p><h3>Последние выплаты</h3>${state.history.slice(-7).reverse().map(h=>`<div class="item row"><span class="muted">Неделя ${h.week}</span><b>+${money(h.earned)}</b></div>`).join('')||'<div class="empty">Пока нет выплат</div>'}</div><div class="card"><h3>Сохранение</h3><p class="muted">Игра автоматически сохраняется на этом устройстве в браузере. Не очищай данные сайта.</p><button class="btn secondary" onclick="exportSave()">Экспорт сохранения</button> <button class="btn secondary" onclick="document.getElementById('importfile').click()">Импорт</button><input type="file" id="importfile" accept="application/json" hidden onchange="importSave(event)"><div class="actions"><button class="btn secondary" onclick="reset()">Начать новую карьеру</button></div></div>`}function exportSave(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='music-empire-save.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function importSave(e){let f=e.target.files[0];if(!f)return;let reader=new FileReader();reader.onload=()=>{try{let s=JSON.parse(reader.result);if(!s.name||!Array.isArray(s.releases)||typeof s.week!=='number')throw Error();state=s;save();render();notify('Сохранение загружено')}catch{notify('Неверный файл сохранения')}};reader.readAsText(f)}function render(){let a=document.getElementById('app');if(!state){a.innerHTML=`<div id="setup"><div class="card hero"><div class="brand">MUSIC <b>EMPIRE</b></div><h1>Твой путь к вершине</h1><p class="muted">Создай артиста. Выпускай музыку, собирай фанатов, выступай и заключай контракты.</p><label class="label">ИМЯ АРТИСТА</label><input class="field" id="artist" maxlength="24" placeholder="Например, FLERIX"><label class="label">ЖАНР</label><select class="field" id="genre">${genres.map(g=>`<option>${g}</option>`).join('')}</select><button class="btn" onclick="start()">Начать карьеру →</button></div></div>`;return}let pages={home,releases,charts,shows,business};a.innerHTML=header()+`<main class="wrap">${pages[tab]()}</main><nav class="nav">${[['home','⌂','Главная'],['releases','♫','Релизы'],['charts','▥','Чарты'],['shows','♬','Концерты'],['business','▣','Бизнес']].map(([id,icon,label])=>`<button class="${tab===id?'active':''}" onclick="tab='${id}';render();window.scrollTo(0,0)"><span>${icon}</span>${label}</button>`).join('')}</nav>`}load();render();if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
